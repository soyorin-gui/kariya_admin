spring:
  application:
    name: lbl-shit
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  # 该值仅供开发环境使用；生产环境请改用环境变量或 Kubernetes Secret。
jasypt:
  encryptor:
    password: kariya
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 100000
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    string-output-type: base64

mybatis-plus:
  global-config:
    banner: false

# 只暴露部署系统真正需要的端点；健康详情不对匿名访问者泄露数据库、Redis 等内部信息。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
