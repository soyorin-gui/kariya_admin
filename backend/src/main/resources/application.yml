spring:
  application:
    name: kariya-admin
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
  # Replace this development-only value with an environment variable or Kubernetes Secret in production.
jasypt:
  encryptor:
    password: kariya
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 100000
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    string-output-type: base64

mybatis-plus:
  global-config:
    banner: false

kariya:
  security:
    jwt-secret: kariya-admin-development-secret-must-be-at-least-32-characters
    access-token-minutes: 15
    idle-hours: 2
    remembered-idle-days: 7
  log:
    # 审计日志保留策略。到期后由 LogRetentionJob 分批物理删除，避免日志表无限膨胀。
    # 关闭清理（enabled: false）后日志只增不删，需要自己安排归档。
    retention:
      enabled: true
      login-days: 180
      operation-days: 365
      batch-size: 2000
      max-batches: 50
      cron: "0 30 3 * * *"
